# Builds the Parkora iPhone app on a Mac in the cloud (GitHub Actions) and uploads it to TestFlight.
#
# Every push to main:
#   1. checks that the iPhone app compiles (iPhone simulator build, no Apple account needed)
#   2. if the App Store Connect secrets are set, builds a signed release and uploads it to TestFlight
#
# Secrets (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com -> Membership)
#   ASC_KEY_ID           App Store Connect API key id
#   ASC_ISSUER_ID        App Store Connect API issuer id
#   ASC_KEY_P8_BASE64    the downloaded AuthKey_XXXX.p8 file, base64-encoded
name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
        shell: bash -eo pipefail {0}   # a failing xcodebuild must fail the job (even when piped into xcbeautify)
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for iPhone simulator (compile check)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build | xcbeautify

      - name: Build signed release and upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          cd iosApp
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY_P8" | base64 --decode > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"

          # Build number must grow with every upload -> use the GitHub run number
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Parkora.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | xcbeautify

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF

          # Export with destination=upload sends the build straight to App Store Connect / TestFlight
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Parkora.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
